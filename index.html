<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>gunco</title>
<meta name="description" content="gunco — минималистичный таск-менеджер" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="gunco" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth" class="auth" hidden>
  <div class="auth-top">
    <div class="brand brand--big"><span class="logo" aria-hidden="true"></span><span class="wordmark">gunco</span></div>
    <p class="auth-tagline">До смерти осталось не так много, успевай делать больше</p>
    <form id="auth-form" class="auth-form" autocomplete="on">
      <input id="auth-email" class="field" type="email" placeholder="e-mail" required autocomplete="email" />
      <input id="auth-pass" class="field" type="password" placeholder="пароль" required autocomplete="current-password" minlength="6" />
      <button id="auth-signin" class="btn btn--solid" type="submit">Войти</button>
      <button id="auth-forgot" class="auth-forgot" type="button">Забыли пароль?</button>
    </form>
    <div class="auth-divider"><span>или</span></div>
    <button id="auth-google" class="btn btn--google" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 11v3.2h4.5c-.2 1.2-1.4 3.4-4.5 3.4-2.7 0-4.9-2.2-4.9-5s2.2-5 4.9-5c1.5 0 2.6.7 3.2 1.2l2.2-2.1C16.7 4.5 14.6 3.6 12 3.6 7.4 3.6 3.7 7.3 3.7 12s3.7 8.4 8.3 8.4c4.8 0 8-3.4 8-8.1 0-.6 0-1-.1-1.3H12z"/></svg>
      Войти через Google
    </button>
    <p id="auth-msg" class="auth-msg"></p>
  </div>
  <div class="auth-bottom">
    <button id="auth-signup" class="btn" type="button">Создать аккаунт</button>
    <p id="auth-mode-hint" class="auth-hint"></p>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="brand-home" class="brand brand-btn" type="button" aria-label="Все задачи">
      <span class="logo" aria-hidden="true"></span><span class="wordmark">gunco</span>
    </button>
    <div class="topbar-actions">
      <button id="theme-btn" class="icon-btn" title="Тема" aria-label="Сменить тему">◐</button>
      <button id="account-btn" class="icon-btn" title="Аккаунт" aria-label="Аккаунт">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg>
      </button>
    </div>
  </header>

  <div class="subhead">
    <button id="back-btn" class="back-btn" type="button" aria-label="Назад" hidden>‹</button>
    <nav id="page-nav" class="page-nav">
      <button class="nav-item active" data-view="tasks" type="button">задачи</button>
      <button class="nav-item" data-view="projects" type="button">проекты</button>
      <button class="nav-item" data-view="notes" type="button">заметки</button>
    </nav>
  </div>

  <main class="main">

    <!-- ЗАДАЧИ (список) -->
    <section id="view-tasks" class="view">
      <div class="pane pane--tasks">
        <div class="pane-head-tools">
          <button id="date-filter" class="chip chip--date" type="button">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg>
            <span id="date-filter-label">все дни</span>
          </button>
          <button id="date-clear" class="chip" type="button" hidden>✕</button>
          <button id="project-filter" class="chip" type="button">проекты</button>
          <button id="status-filter" class="chip" type="button">статусы</button>
        </div>
        <div id="task-list" class="task-list scroll"></div>
        <p id="tasks-empty" class="empty" hidden>Пока нет задач</p>
      </div>
      <div class="slider-wrap">
        <div class="slider-caption">сколько показать задач</div>
        <div class="slider-bar">
          <input id="slider-val" class="slider-val" type="text" inputmode="numeric" value="5" aria-label="Количество задач" />
          <input id="task-count" class="slider" type="range" min="3" max="9" step="1" value="5" aria-label="Сколько задач показывать" />
        </div>
      </div>
    </section>

    <!-- КАРТОЧКА ЗАДАЧИ (создание/редактирование) -->
    <section id="view-task" class="view view--form" hidden>
      <div class="taskcard scroll">
        <div id="t-title" class="taskcard-title" contenteditable="true" data-placeholder="Новая задача"></div>
        <div class="taskcard-meta">
          <button id="t-status" class="status-slot" type="button"></button>
          <button id="t-project" class="proj-pill proj-slot" type="button"></button>
        </div>
        <div class="taskcard-meta taskcard-meta--datetime">
          <button id="t-date" class="meta-pill" type="button"></button>
          <input id="t-time" class="meta-pill meta-time" type="time" step="60" aria-label="время" />
          <button id="t-notify" class="meta-pill meta-bell" type="button" aria-label="уведомление"></button>
        </div>
        <div id="t-desc" class="taskcard-desc" contenteditable="true" data-placeholder="описание"></div>
      </div>
      <div class="form-foot">
        <div class="form-actions">
          <button id="t-submit" class="btn btn--solid" type="button">Добавить</button>
          <button id="t-delete" class="btn btn--danger" type="button" hidden>Удалить</button>
        </div>
      </div>
    </section>

    <!-- ПРОЕКТЫ (канбан) -->
    <section id="view-projects" class="view" hidden>
      <div id="kanban" class="kanban"></div>
    </section>

    <!-- КАРТОЧКА ПРОЕКТА -->
    <section id="view-project" class="view view--form" hidden>
      <div class="taskcard scroll">
        <div class="proj-head">
          <button id="p-emoji" class="proj-emoji-btn" type="button" aria-label="Эмодзи"></button>
          <div id="p-title" class="taskcard-title" contenteditable="true" data-placeholder="Новый проект"></div>
        </div>
        <div class="taskcard-meta">
          <button id="p-status" class="status-slot" type="button"></button>
        </div>
        <div class="taskcard-meta taskcard-meta--datetime">
          <button id="p-start" class="meta-pill" type="button"></button>
          <button id="p-end" class="meta-pill" type="button"></button>
        </div>
        <div class="proj-tasks">
          <div class="proj-tasks-head">задачи</div>
          <div class="pane-head-tools">
            <button id="p-date-filter" class="chip chip--date" type="button">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg>
              <span id="p-date-filter-label">все дни</span>
            </button>
            <button id="p-date-clear" class="chip" type="button" hidden>✕</button>
            <button id="p-status-filter" class="chip" type="button">статусы</button>
          </div>
          <div id="p-task-list" class="task-list"></div>
          <p id="p-tasks-empty" class="empty" hidden>нет задач</p>
          <button id="p-add-task" class="proj-add-task" type="button">+ задача</button>
        </div>
        <div id="p-desc" class="taskcard-desc" contenteditable="true" data-placeholder="добавить описание..."></div>
      </div>
      <div class="form-foot">
        <div class="form-actions">
          <button id="p-submit" class="btn btn--solid" type="button">Создать</button>
          <button id="p-delete" class="btn btn--danger" type="button" hidden>Удалить</button>
        </div>
      </div>
    </section>

    <!-- ЗАМЕТКИ (страница, пока пустая) -->
    <section id="view-notes" class="view" hidden>
      <div class="pane"></div>
    </section>

  </main>

  <button id="fab" class="fab" type="button" aria-label="Новая задача">+</button>

  <div id="account-pop" class="account-pop" hidden>
    <div class="account-label">аккаунт</div>
    <div id="account-email" class="account-email"></div>
    <button id="notif-btn" class="btn" type="button">Включить уведомления</button>
    <button id="account-signout" class="btn" type="button">Выйти</button>
  </div>
</div>

<!-- Календарь (только дата) -->
<div id="cal" class="modal" hidden>
  <div class="modal-card cal-card">
    <div class="cal-head">
      <button id="cal-prev" class="icon-btn" aria-label="Назад">‹</button>
      <div id="cal-title" class="cal-title"></div>
      <button id="cal-next" class="icon-btn" aria-label="Вперёд">›</button>
    </div>
    <div class="cal-weekdays"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
    <div id="cal-grid" class="cal-grid"></div>
    <div class="cal-actions">
      <button id="cal-all" class="btn" type="button" hidden>Все дни</button>
      <button id="cal-cancel" class="btn" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Дата + время + уведомление (большое окно) -->
<div id="datetime-modal" class="modal" hidden>
  <div class="modal-card dt-card">
    <div class="cal-head">
      <button id="dt-prev" class="icon-btn" aria-label="Назад">‹</button>
      <div id="dt-title" class="cal-title"></div>
      <button id="dt-next" class="icon-btn" aria-label="Вперёд">›</button>
    </div>
    <div class="cal-weekdays"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
    <div id="dt-grid" class="cal-grid"></div>
    <input id="dt-time" class="field time-input" type="time" step="60" aria-label="время" />
    <button id="dt-notify" class="bell-btn" type="button" aria-label="Уведомление">
      <svg class="bell-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8.6a6 6 0 0112 0c0 4.4 1.8 5.7 2.4 6.2.4.3.1.9-.4.9H4c-.5 0-.8-.6-.4-.9.6-.5 2.4-1.8 2.4-6.2z"/><path d="M10 19a2 2 0 004 0"/><line class="bell-slash" x1="4.5" y1="4" x2="20" y2="20.5"/>
      </svg>
      <span class="bell-txt">уведомление</span>
    </button>
    <div class="form-actions">
      <button id="dt-done" class="btn btn--solid" type="button">Готово</button>
      <button id="dt-cancel" class="btn" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Статус (одиночный выбор) -->
<div id="status-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">статус</div>
    <div id="status-list" class="status-list"></div>
  </div>
</div>

<!-- Фильтр по статусам (мультивыбор) -->
<div id="statusfilter-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">статусы</div>
    <div id="statusfilter-list" class="status-list"></div>
  </div>
</div>

<!-- Создание статуса -->
<div id="statusform-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">новый статус</div>
    <input id="statusform-name" class="field" type="text" placeholder="название статуса" maxlength="30" aria-label="Название" />
    <div id="statusform-swatches" class="statusform-swatches"></div>
    <div class="form-actions">
      <button id="statusform-ok" class="btn btn--solid" type="button">Добавить</button>
      <button id="statusform-cancel" class="btn" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Проекты (выбор для задачи и фильтр) -->
<div id="project-modal" class="modal" hidden>
  <div class="modal-card pick-modal">
    <div class="modal-title" id="project-modal-title">проект</div>
    <div class="search-wrap">
      <input id="project-search" class="field field--search" type="text" placeholder=" " aria-label="Поиск проекта" />
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </div>
    <div id="project-list" class="proj-list scroll"></div>
    <button id="project-reset" class="fmenu-reset" type="button" hidden>сбросить</button>
  </div>
</div>

<!-- Создание проекта -->
<div id="projform-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">новый проект</div>
    <div class="projform">
      <button id="projform-emoji" class="projform-emoji" type="button" aria-label="Выбрать эмодзи"></button>
      <input id="projform-name" class="field" type="text" placeholder="название проекта" maxlength="40" aria-label="Название" />
    </div>
    <div class="form-actions">
      <button id="projform-ok" class="btn btn--solid" type="button">Добавить</button>
      <button id="projform-cancel" class="btn" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Подтверждение удаления -->
<div id="confirm-modal" class="modal" hidden>
  <div class="modal-card confirm-card">
    <div class="modal-title" id="confirm-text">Удалить?</div>
    <div class="form-actions">
      <button id="confirm-yes" class="btn btn--solid" type="button">Да</button>
      <button id="confirm-no" class="btn" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Новый пароль -->
<div id="pw-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">Новый пароль</div>
    <input id="pw-input" class="field" type="password" placeholder="новый пароль" minlength="6" autocomplete="new-password" />
    <p id="pw-msg" class="auth-msg"></p>
    <div class="form-actions"><button id="pw-ok" class="btn btn--solid" type="button">Сохранить</button></div>
  </div>
</div>

<!-- Выбор эмодзи -->
<div id="emoji-modal" class="modal" hidden>
  <div class="modal-card emoji-card">
    <div class="modal-title">эмодзи</div>
    <input id="emoji-input" class="field" type="text" maxlength="8" placeholder="свой эмодзи (клавиатура)" aria-label="Свой эмодзи" />
    <div id="emoji-grid" class="emoji-grid scroll"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
